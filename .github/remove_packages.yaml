parameters:
  - name: publish_artifacts
    displayName: 'Publish Artifacts to Linux Repos'
    type: boolean
    default: false

  - name: draft
    displayName: 'Post as Draft Release'
    type: boolean
    default: false

  - name: prerelease
    displayName: 'Post as PreRelease'
    type: boolean
    default: false

  - name: update_version
    displayName: 'Update Version'
    type: boolean
    default: false

  - name: versionName
    displayName: "Version Name"
    type: string
    default: "0.0.0"

  # PMC target to remove from. Defaults to tuxdev to avoid accidental prod
  # removals. Set to 'prod' explicitly for a real prod cleanup.
  - name: targetEnv
    displayName: 'PMC target'
    type: string
    default: 'tuxdev'
    values:
    - prod
    - tuxdev

# Do not trigger this pipeline automatically
trigger:
  - none

# Do not trigger this pipeline by pull requests
pr:
  - none

variables:
- ${{ if eq(parameters.targetEnv, 'prod') }}:
  - name: pmcBaseUrl
    value: 'https://pmc-ingest.trafficmanager.net/api/v4'
  - name: pmcServiceConnection
    value: 'Azure AZNFS'
- ${{ if eq(parameters.targetEnv, 'tuxdev') }}:
  - name: pmcBaseUrl
    value: 'https://tux-ingest.trafficmanager.net/api/v4'
  - name: pmcServiceConnection
    value: 'Azure AZNFS TuxDev'

stages:
  - stage: RemoveAllPackage
    jobs:
      - job: RemovePackage
        timeoutInMinutes: 120
      
        pool:
          vmImage: 'ubuntu-22.04'

        steps:
          - checkout: none

          - task: PipAuthenticate@1
            inputs:
              artifactFeeds: 'One/aznfs'
          - script: pip install pmc-cli
            displayName: 'Install pmc-cli'

          - task: AzureCLI@2
            inputs:
              addSpnToEnvironment: true
              azureSubscription: $(pmcServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                  # PMC endpoint resolved from targetEnv pipeline parameter.
                  PMC_URL="$(pmcBaseUrl)"
                  echo "Removing aznfs packages from PMC: $PMC_URL"

                  # Define the package name
                  PACKAGE_NAME="aznfs"

                  echo "package list ...... deb:"
                  pmc --base-url "$PMC_URL" package deb list --name "$PACKAGE_NAME"

                  for id in $(pmc --base-url "$PMC_URL" package deb list --name "$PACKAGE_NAME" | jq -r '.results[].id'); do

                    echo "Package ID: $id"

                    # Remove the package from all repositories
                    for repo in $(pmc --base-url "$PMC_URL" repo list --package "$id" | jq -r '.results[].name'); do
                      echo "Removing package from repo: $repo"
                      pmc --base-url "$PMC_URL" repo package update --remove-packages "$id" "$repo"

                      echo "Republishing repo: $repo"
                      pmc --base-url "$PMC_URL" repo publish "$repo"
                    done
                  done

                  echo "package list ...... rpm:"
                  pmc --base-url "$PMC_URL" package rpm list --name "$PACKAGE_NAME"


                  for id in $(pmc --base-url "$PMC_URL" package rpm list --name "$PACKAGE_NAME" | jq -r '.results[].id'); do

                    echo "Package ID: $id"

                    # Remove the package from all repositories
                    for repo in $(pmc --base-url "$PMC_URL" repo list --package "$id" | jq -r '.results[].name'); do
                      echo "Removing package from repo: $repo"
                      pmc --base-url "$PMC_URL" repo package update --remove-packages "$id" "$repo"

                      echo "Republishing repo: $repo"
                      pmc --base-url "$PMC_URL" repo publish "$repo"
                    done
                  done

                  


                  




